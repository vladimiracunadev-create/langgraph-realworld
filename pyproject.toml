[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project]
name = "langgraph-realworld"
version = "4.5.0"
description = "Portafolio de 25 casos de uso empresariales con LangGraph y FastAPI: 13 backends operativos con streaming, OAuth2 opt-in, observabilidad, modo DEMO/LIVE y portal unificado."
dependencies = [
    "PyYAML>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
