[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Tests: tolerantes con prácticas comunes (E741 `l`, E702 imports en una línea, E501 fixtures largas)
"cases/*/backend/tests/*.py" = ["E741", "E702", "E501"]
"tests/*.py" = ["E741", "E702", "E501"]
# Src de casos: F841 unused vars (algunas se mantienen por documentación/legibilidad);
# E501 cuando excede 140 (raros casos de prompts largos en una sola línea);
# E702 statements con ; (patrón inline en helpers de seed).
"cases/*/backend/src/*.py" = ["F841", "E501", "E702"]

[project]
name = "langgraph-realworld"
version = "4.7.0"
description = "Portafolio de 25 casos de uso empresariales con LangGraph y FastAPI: 15 backends operativos (01, 02, 03, 04, 05, 06, 08, 09, 10, 13, 14, 17, 19, 21, 25) con streaming, OAuth2 opt-in, observabilidad, modo DEMO/LIVE y portal unificado. Soporta uv (Astral) opcional."
dependencies = [
    "PyYAML>=6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
