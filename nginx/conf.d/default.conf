# Upstream backends
upstream portal   { server portal:8080; }
upstream case01   { server case01:8001; }
upstream case02   { server case02:8002; }
upstream case03   { server case03:8003; }
upstream case09   { server case09:8009; }
upstream case10   { server case10:8010; }
upstream case13   { server case13:8013; }
upstream case19   { server case19:8019; }
upstream case25   { server case25:8025; }

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;

    # Health check endpoint (no redirect — used by Docker healthcheck)
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main entrypoint
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # HSTS (6 months)
    add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;

    # Common security headers
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header X-Content-Type-Options    nosniff always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'" always;

    # Portal (root)
    location / {
        proxy_pass         http://portal;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Case 01 — Soporte Cliente Omnicanal
    location /api/case01/ {
        proxy_pass         http://case01/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
