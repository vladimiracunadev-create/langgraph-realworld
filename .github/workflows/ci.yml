name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python_repo:
    name: "Python checks (repo)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install repo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check hub.py tests
      - name: Compile (syntax check)
        run: |
          python -m compileall hub.py tests -q
      - name: Tests (pytest)
        run: |
          pytest -q tests

  python_case02:
    name: "Python checks (case 02)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
