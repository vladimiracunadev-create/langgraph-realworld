name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python_repo:
    name: "Python checks (repo)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install repo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check hub.py tests
      - name: Compile (syntax check)
        run: |
          python -m compileall hub.py tests -q
      - name: Tests (pytest)
        run: |
          pytest -q tests
      - name: Verify shared/ canonical files in sync with all 25 cases
        run: |
          python scripts/sync_shared.py --check

  python_case:
    name: "Python checks (case ${{ matrix.case }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case:
          - "01-soporte-cliente-omnicanal"
          - "02-mesa-ayuda-ti-runbooks"
          - "03-incident-response-sre"
          - "04-soc-triage-alertas"
          - "05-analista-documentos"
          - "06-compliance-auditorias"
          - "07-compras-abastecimiento"
          - "08-ventas-b2b-crm"
          - "09-rrhh-screening-agenda"
          - "10-onboarding-empleados"
          - "11-educacion-tutor-adaptativo"
          - "12-psicometria-evaluaciones"
          - "13-bi-analista-datos"
          - "14-finanzas-conciliacion"
          - "15-ecommerce-postventa"
          - "16-viajes-planificador"
          - "17-legal-intake"
          - "18-marketing-contenido-qa"
          - "19-devex-pr-review"
          - "20-migracion-legacy"
          - "21-docs-auto"
          - "22-backoffice-automatizacion"
          - "23-salud-pretriage"
          - "24-pm-assistant"
          - "25-supervisor-workers"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          # Extras requeridos por algunos casos antes del freeze
          if [ "${{ matrix.case }}" = "09-rrhh-screening-agenda" ]; then
            python -m pip install pydantic tenacity
          fi
          if [ "${{ matrix.case }}" = "13-bi-analista-datos" ]; then
            python -m pip install pydantic-settings
          fi
          python -m pip install -r cases/${{ matrix.case }}/backend/requirements.txt --only-binary=:all: || \
            python -m pip install -r cases/${{ matrix.case }}/backend/requirements.txt
      - name: Seed demo database (case 13)
        if: matrix.case == '13-bi-analista-datos'
        run: |
          python cases/13-bi-analista-datos/data/init_db.py
      - name: Lint (ruff)
        run: |
          if [ -d cases/${{ matrix.case }}/backend/tests ]; then
            ruff check cases/${{ matrix.case }}/backend/src cases/${{ matrix.case }}/backend/tests
          else
            ruff check cases/${{ matrix.case }}/backend/src
          fi
      - name: Compile (syntax check)
        run: |
          if [ -d cases/${{ matrix.case }}/backend/tests ]; then
            python -m compileall cases/${{ matrix.case }}/backend/src cases/${{ matrix.case }}/backend/tests -q
          else
            python -m compileall cases/${{ matrix.case }}/backend/src -q
          fi
      - name: Tests (pytest)
        run: |
          pytest -q cases/${{ matrix.case }}/backend/tests

  docker_build_all_cases:
    name: "Docker build (all cases)"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        case:
          - "01-soporte-cliente-omnicanal"
          - "02-mesa-ayuda-ti-runbooks"
          - "03-incident-response-sre"
          - "04-soc-triage-alertas"
          - "05-analista-documentos"
          - "06-compliance-auditorias"
          - "07-compras-abastecimiento"
          - "08-ventas-b2b-crm"
          - "09-rrhh-screening-agenda"
          - "10-onboarding-empleados"
          - "11-educacion-tutor-adaptativo"
          - "12-psicometria-evaluaciones"
          - "13-bi-analista-datos"
          - "14-finanzas-conciliacion"
          - "15-ecommerce-postventa"
          - "16-viajes-planificador"
          - "17-legal-intake"
          - "18-marketing-contenido-qa"
          - "19-devex-pr-review"
          - "20-migracion-legacy"
          - "21-docs-auto"
          - "22-backoffice-automatizacion"
          - "23-salud-pretriage"
          - "24-pm-assistant"
          - "25-supervisor-workers"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build case demo image
        run: |
          echo "Building cases/${{ matrix.case }}/demo"
          docker build -t "lg-case-${{ matrix.case }}:ci" "cases/${{ matrix.case }}/demo"
      - name: Build case backend image (if present)
        run: |
          if [ -f "cases/${{ matrix.case }}/backend/Dockerfile" ]; then
            echo "Building cases/${{ matrix.case }}/backend"
            docker build -t "lg-backend-${{ matrix.case }}:ci" "cases/${{ matrix.case }}/backend"
          else
            echo "No backend Dockerfile for ${{ matrix.case }} (ok)."
          fi

  docker_build_root_site:
    name: "Docker build (root site)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build root site
        run: |
          docker build -t lg-site:ci -f Dockerfile.site .
