          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          python -m pip install -r cases/02-mesa-ayuda-ti-runbooks/backend/requirements.txt --only-binary=:all: || python -m pip install -r cases/02-mesa-ayuda-ti-runbooks/backend/requirements.txt
      - name: Lint (ruff)
        run: |
          ruff check cases/02-mesa-ayuda-ti-runbooks/backend/src cases/02-mesa-ayuda-ti-runbooks/backend/tests
      - name: Compile (syntax check)
        run: |
          python -m compileall cases/02-mesa-ayuda-ti-runbooks/backend/src cases/02-mesa-ayuda-ti-runbooks/backend/tests -q
      - name: Tests (pytest)
        run: |
          pytest -q cases/02-mesa-ayuda-ti-runbooks/backend/tests

