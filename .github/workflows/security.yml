name: Security Scan

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8a8a642e79153f5d047b10ec1cba1d1cc65699
        with:
          languages: python
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@5c8a8a642e79153f5d047b10ec1cba1d1cc65699
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5c8a8a642e79153f5d047b10ec1cba1d1cc65699

  secrets:
    name: Secret scan (baseline enforced)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets==1.5.0
      - name: Validate baseline format
        run: |
          python -m json.tool .secrets.baseline > /dev/null
      - name: Scan tracked files for new secrets
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Full filesystem scan (untracked + all files)
        run: |
          detect-secrets scan --all-files \
            --exclude-files '\.secrets\.baseline' \
            --exclude-files '.*\.lock' \
            --exclude-files '\.git/' \
            > /tmp/full-scan-results.json
          python - <<'EOF'
          import json, sys
          with open('/tmp/full-scan-results.json') as f:
              results = json.load(f)
          secrets = results.get('results', {})
          if secrets:
              print('SECRETS DETECTED:', json.dumps(secrets, indent=2))
              sys.exit(1)
          print('No new secrets found in full filesystem scan.')
          EOF
      - name: Git history scan (last 50 commits)
        run: |
          git log --format="%H" -n 50 | while read -r sha; do
            git show "$sha" | detect-secrets-hook --baseline .secrets.baseline || {
              echo "::error::Secret detected in commit $sha"
              exit 1
            }
          done
          echo "Git history scan complete — no secrets found."

  supply_chain:
    name: Supply-chain checks (bidi + obfuscation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Detect Unicode bidirectional control chars (CVE-2021-42574)
        run: |
          # Characters U+202A–U+202E, U+2066–U+2069, U+200F, U+061C
          if git ls-files -z | xargs -0 grep -PlU $'\x{202a}|\x{202b}|\x{202c}|\x{202d}|\x{202e}|\x{2066}|\x{2067}|\x{2068}|\x{2069}|\x{200f}|\x{061c}' 2>/dev/null; then
            echo "::error::Bidirectional Unicode control characters detected (Trojan Source attack vector)."
            exit 1
          fi
          echo "No bidirectional Unicode control characters found."
      - name: Detect obfuscation patterns (base64 exec, eval injection)
        run: |
          status=0
          # Exclude .github/ — workflow files legitimately contain these strings as detection rules.
          # Exclude cases/*/data/ and cases/*/tests/ — intentional insecure code in demo fixtures
          # and test strings that verify the security analyzer detects these patterns (e.g. case 19).
          EXCLUDE_FILTER='\.github/|cases/.*/data/|cases/.*/tests/'
          # base64-decoded execution: exec(base64.b64decode(...))
          if git ls-files -z | grep -zEv "$EXCLUDE_FILTER" | xargs -0 grep -Pl 'exec\s*\(\s*base64' 2>/dev/null; then
            echo "::warning::base64+exec pattern detected. Review manually."
            status=1
          fi
          # eval() with non-literal argument in Python
          if git ls-files -z | grep -zEv "$EXCLUDE_FILTER" | xargs -0 grep -Pl 'eval\s*\([^")'"'"']' 2>/dev/null; then
            echo "::warning::Dynamic eval() detected. Review manually."
            status=1
          fi
          # subprocess/os.system with user-controlled concat
          if git ls-files -z | grep -zEv "$EXCLUDE_FILTER" | xargs -0 grep -Pl 'os\.system\s*\(.*\+' 2>/dev/null; then
            echo "::warning::os.system with string concatenation detected. Review manually."
            status=1
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "Obfuscation/injection patterns found — review the warnings above before merging."
            exit 1
          fi
          echo "No obfuscation patterns found."

  container_scan:
    name: Container image scan (grype)
    runs-on: ubuntu-latest
    # NOTE: We use grype (Anchore) instead of Trivy due to a known supply-chain
    # incident affecting Trivy's distribution channel. grype is pinned to a
    # commit SHA and verified before use.
    # Ref: https://github.com/anchore/grype
    strategy:
      fail-fast: false
      matrix:
        case:
          - "01-soporte-cliente-omnicanal"
          - "02-mesa-ayuda-ti-runbooks"
          - "03-incident-response-sre"
          - "09-rrhh-screening-agenda"
          - "10-onboarding-empleados"
          - "13-bi-analista-datos"
          - "19-devex-pr-review"
          - "25-supervisor-workers"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build backend image
        run: |
          if [ -f "cases/${{ matrix.case }}/backend/Dockerfile" ]; then
            docker build -t "scan-target:ci" "cases/${{ matrix.case }}/backend"
          else
            echo "No backend Dockerfile for ${{ matrix.case }} — skip."
            exit 0
          fi
      - name: Scan with grype (pinned SHA)
        uses: anchore/scan-action@2c901ab7378897c01b8efaa2d0c9bf519cc64b9e
        with:
          image: "scan-target:ci"
          fail-build: true
          severity-cutoff: critical
          output-format: table

  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    env:
      ENFORCEMENT_MODE: ${{ github.event_name == 'pull_request' && 'soft' || 'hard' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit requirements files
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t reqs < <(
            printf '%s\n' requirements.txt cases/*/backend/requirements.txt | while read -r file; do
              [[ -f "$file" ]] && echo "$file"
            done
          )

          if [[ ${#reqs[@]} -eq 0 ]]; then
            echo 'No requirements files found.'
            exit 0
          fi

          status=0
          printf '## Python dependency audit (%s)\n\n' "$ENFORCEMENT_MODE" >> "$GITHUB_STEP_SUMMARY"

          for req in "${reqs[@]}"; do
            echo "Auditing $req"
            if python -m pip_audit -r "$req" --progress-spinner off; then
              echo "- PASS \`$req\`" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              echo "- FINDINGS \`$req\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [[ "$status" -ne 0 && "$ENFORCEMENT_MODE" == 'hard' ]]; then
            exit "$status"
          fi

          if [[ "$status" -ne 0 ]]; then
            echo 'Dependency findings detected in soft mode. Review the job log and schedule remediation.'
          fi
