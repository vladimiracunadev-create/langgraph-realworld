version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python — raíz + los 25 casos (glob cubre cases/01..25/backend)
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/cases/*/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      python:
        patterns:
          - "*"

  # Docker — raíz
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "security"
    groups:
      docker:
        patterns:
          - "*"
