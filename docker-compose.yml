services:
  portal:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8080:8080"
    command: python -m http.server 8080

  case01:
    build:
      context: cases/01-soporte-cliente-omnicanal/backend
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./cases/01-soporte-cliente-omnicanal/data:/app/data:ro
      - ./cases/01-soporte-cliente-omnicanal/backend/web:/app/web:ro
    environment:
      - DATA_DIR=/app/data
      - WEB_DIR=/app/web
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - USE_LLM=${USE_LLM:-true}

  case02:
    build:
      context: cases/02-mesa-ayuda-ti-runbooks/backend
    ports:
      - "127.0.0.1:8002:8002"
